<style>
:root{--bg:#FFF8F0;--card:#FFFDF6;--ink:#1B2412;--mute:#5B6650;--line:#D9D2BC;--g:#C75000;--gt:#FFFFFF;--rust:#C75000;--o:#FF8200;--quijote:.09;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;min-height:100vh}
h1,h2,h3{font-family:'Space Grotesk',system-ui,sans-serif;margin:0}
header{position:relative;z-index:1;border-bottom:4px solid #C75000;background:var(--o);color:#1B1208;padding:14px 20px;display:flex;justify-content:space-between;align-items:center;gap:12px}
header b{font-family:'Space Grotesk',sans-serif;font-size:1.25rem;letter-spacing:.06em}
header span{font-size:0.8125rem}
main{position:relative;z-index:1;max-width:61.25rem;margin:0 auto;padding:24px 20px 120px}
.card{background:rgba(255,253,246,.92);border:1px solid var(--line);border-radius:16px;padding:20px}
.btn{min-height:3rem;padding:0 22px;border-radius:10px;border:0;background:var(--g);color:var(--gt);font:600 1rem 'Inter',sans-serif;cursor:pointer}
.btn.o{background:transparent;color:var(--g);border:1.5px solid var(--g)}
.btn:disabled{opacity:.4;cursor:not-allowed}
.bar{height:10px;background:var(--line);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--g));transition:width .3s}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,16.875rem),1fr));gap:14px;margin-top:18px}
.sv{display:flex;flex-direction:column;gap:10px}
.tag{font-size:0.75rem;font-weight:600;padding:3px 10px;border-radius:99px;align-self:flex-start;background:var(--line);color:var(--mute)}
.tag.p{background:var(--rust);color:var(--gt)}
.sc{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.sc button{min-height:3rem;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:600 1rem 'Inter',sans-serif;cursor:pointer}
.sc button.on{background:var(--g);color:var(--gt);border-color:var(--g)}
.asp{margin-top:14px}
.asp p{margin:0;line-height:1.45}
.ft{position:fixed;left:0;right:0;bottom:0;z-index:3;background:var(--card);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:12px;justify-content:center;align-items:center}
.ft .in{max-width:58.75rem;width:100%;display:flex;gap:12px;align-items:center;justify-content:space-between}
#sheet{position:fixed;inset:0;z-index:5;background:rgba(0,0,0,.5);display:none;align-items:flex-end;justify-content:center}
#sheet.on{display:flex}
#sheet .box{background:var(--card);width:100%;max-width:32.5rem;border-radius:20px 20px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
@media(min-width:700px){#sheet{align-items:center}#sheet .box{border-radius:20px}}
.hero{text-align:center;padding:40px 8px}
.hero h1{font-size:clamp(40px,9vw,64px);color:var(--g);line-height:1}
.stamp{display:inline-block;border:3px double var(--rust);color:var(--rust);padding:6px 16px;border-radius:8px;font-weight:700;transform:rotate(-4deg)}

#bgq{position:fixed;right:2%;bottom:0;height:86vh;z-index:0;pointer-events:none;mix-blend-mode:multiply;opacity:.55}
body.login #bgq{opacity:.95;height:92vh}
body.login .hero{text-align:left;max-width:32.5rem;margin:0}
body.login .hero .card,body.login .hero p{margin-left:0!important;margin-right:auto!important}
@media(max-width:700px){#bgq{opacity:.16;right:-12%}body.login #bgq{opacity:.22}}
#fab{position:fixed;right:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:10;display:flex;align-items:center;gap:10px;border:0;background:#fff;border-radius:99px;padding:6px 18px 6px 6px;box-shadow:0 10px 30px rgba(20,40,10,.25);cursor:pointer;font:600 0.875rem 'Inter',sans-serif;color:var(--ink)}
.av{width:3rem;height:3rem;border-radius:50%;object-fit:cover;object-position:50% 20%;background:#C75000;flex:none}
#fab .av{box-shadow:0 0 0 3px #FF8200;animation:p 2.4s infinite}
@keyframes p{0%,100%{box-shadow:0 0 0 3px #FF8200}50%{box-shadow:0 0 0 7px rgba(255,130,0,.28)}}
#chat{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;width:min(380px,calc(100vw - 32px));height:min(560px,calc(100vh - 90px));background:#fff;border-radius:22px;box-shadow:0 20px 60px rgba(20,40,10,.35);display:none;flex-direction:column;overflow:hidden}
#chat.on{display:flex}
.ch{background:linear-gradient(135deg,#FF8200,#FFA040);color:#1B1208;padding:14px 16px;display:flex;align-items:center;gap:12px}
.ch .av{box-shadow:0 0 0 2px #fff}
.ch b{display:block;font-family:'Space Grotesk',sans-serif;font-size:1.0625rem}
.ch span{font-size:0.75rem;opacity:.9}.ch span:before{content:'';display:inline-block;width:8px;height:8px;border-radius:50%;background:#4DC3B6;margin-right:6px}
.ch button{margin-left:auto;background:none;border:0;color:#1B1208;font-size:1.625rem;cursor:pointer;min-width:44px;min-height:2.75rem}
#msgs{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:10px;background:#F6F3E8}
.m{max-width:86%;padding:10px 14px;border-radius:16px;line-height:1.45;font-size:0.9375rem}
.m.bot{background:#fff;border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.m.me{background:var(--g);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.m .btn{min-height:2.5rem;font-size:0.875rem;margin-top:8px;padding:0 16px}
.dots i{display:inline-block;width:7px;height:7px;margin-right:4px;border-radius:50%;background:var(--mute);animation:d 1s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
@keyframes d{0%,100%{opacity:.25}50%{opacity:1}}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 0;background:#fff}
.chips button{min-height:2.5rem;padding:0 14px;border-radius:99px;border:1.5px solid var(--g);background:#fff;color:var(--g);font:600 0.8125rem 'Inter',sans-serif;cursor:pointer}
.inp{display:flex;gap:8px;padding:10px 12px 12px;background:#fff}
.inp input{flex:1;min-height:2.875rem;border:1.5px solid var(--line);border-radius:12px;padding:0 14px;font:0.9375rem 'Inter',sans-serif}
.inp button{width:46px;border:0;border-radius:12px;background:#C75000;color:#fff;font-size:1.25rem;cursor:pointer}
@media(max-width:700px){#chat{right:8px;width:calc(100vw - 16px)}}
header select{background:rgba(255,255,255,.6);color:#1B1208;border:1px solid rgba(27,18,8,.25);border-radius:99px;padding:8px 12px;font:500 0.8125rem 'Inter',sans-serif}header select option{color:#17220F}
ul{list-style:none;margin:0;padding:0}li.r{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}li.r:last-child{border:0}li.r small{display:block;color:var(--mute)}
.in2{min-height:3.125rem;border:1.5px solid var(--line);border-radius:10px;padding:0 14px;font:1rem 'Inter',sans-serif;width:100%}

:root{--bg:#FFFBF5;--card:#FFFFFF;--ink:#14110F;--mute:#4A443D;--line:#C9BCA9;--g:#167A3E;--gt:#FFFFFF;--rust:#FF8200;--o:#FF8200}

header{margin:12px 12px 0;border-radius:20px;border:2px solid #14110F;box-shadow:0 4px 0 #14110F;z-index:20}
#u{display:none}
#mn{position:relative}
#mb{min-height:2.875rem;padding:0 18px;border-radius:99px;border:2px solid #14110F;background:#fff;color:#14110F;font:700 0.9375rem 'Inter',sans-serif;cursor:pointer}
#mp{position:absolute;right:0;top:calc(100% + 10px);min-width:220px;background:#fff;border:2px solid #14110F;border-radius:16px;padding:8px;box-shadow:0 4px 0 #14110F}

.opt{display:flex;align-items:center;gap:12px;min-height:3.25rem;padding:0 14px;border:2px solid #8C8272;border-radius:12px;background:#fff;font-weight:600;cursor:pointer}

@keyframes fi{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
#app.sw>*{animation:fi .3s ease-out}
@media(prefers-reduced-motion:reduce){#app.sw>*{animation:none}}

.mxw{background:#fff;border:2px solid #E0D3C0;border-radius:18px;overflow-x:clip}
table.mx{border-collapse:separate;border-spacing:0;width:100%;table-layout:fixed}
.mx th,.mx td{padding:10px 8px;border-bottom:1px solid #E7DDCF;vertical-align:middle}

.acts{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;justify-content:center}
.acts .btn{flex:1;min-width:200px;max-width:17.5rem}
.ptab{width:100%;border-collapse:collapse}
.ptab th{font-size:0.8125rem;color:#4A443D;text-align:left;padding:8px 6px;border-bottom:2px solid #E0D3C0}
.ptab td{padding:12px 6px;border-bottom:1px solid #E7DDCF;vertical-align:middle}
.ptab td small{display:block;color:#4A443D;font-size:0.8125rem}
.ptab tr:last-child td{border:0}
.ptab .lnk{min-height:2.5rem}
.gc{gap:8px}
.gc .rowp b{font-size:0.9375rem}
.gc .btn{min-height:2.75rem;font-size:0.875rem}
.note{font-size:0.875rem;color:#4A443D;margin:10px 0 0;line-height:1.5}
#app>.kp,#app>.two,#app>.flt,#app>.seg,#app>.acts,#app>h3,#app>div:not([class]){max-width:47.5rem;margin-left:auto;margin-right:auto}
#app>h3{display:block}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:#14110F;color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;z-index:30;opacity:0;pointer-events:none;transition:.25s;max-width:calc(100vw - 32px)}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:600px){.ptab thead{display:none}.ptab tr{display:grid;grid-template-columns:1fr auto;padding:10px 0;border-bottom:1px solid #E7DDCF}.ptab td{border:0;padding:2px 0}.ptab td.c3{grid-column:1/-1}}

#bgp:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,20,35,.62) 0%,rgba(10,20,35,.38) 45%,rgba(10,20,35,0) 75%)}
@media(max-width:700px){#bgp:after{background:rgba(10,20,35,.42)}}
body.login #bgp{display:block}
body.login .hero{padding-top:56px}
body.login .hero h1{-webkit-text-fill-color:#fff;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.45)}
body.login .hero>p{color:#fff!important;text-shadow:0 1px 8px rgba(0,0,0,.5);font-weight:500}
body.login .hero h1:after{content:'';display:block;width:64px;height:5px;border-radius:3px;background:#FF8200;margin-top:16px}
body.login .ft,body.login footer{background:#fff}
@media(max-width:700px){#bgp{background-position:60% 60%}}
/* === chat: preguntas frecuentes en una sola fila === */
#chat{height:min(560px,calc(100vh - 32px))}
#msgs{min-height:0}
.chips{flex-wrap:nowrap;overflow-x:auto;overflow-y:hidden;padding:10px 12px 6px;gap:8px;flex:none;scrollbar-width:thin;border-top:2px solid #F3E3D0;-webkit-overflow-scrolling:touch}
.chips button{flex:none;white-space:nowrap;min-height:2.375rem;font-size:0.8125rem}
.chips:before{content:'Preguntas frecuentes →';flex:none;align-self:center;font-size:0.75rem;font-weight:700;color:#4A443D;white-space:nowrap}
.inp{flex:none}

.usel{font-size:0.875rem;font-weight:700;color:#14110F;margin-top:4px}
.uselw{position:relative}
.uselw:after{content:'';position:absolute;right:18px;top:50%;width:10px;height:10px;border-right:2.5px solid #14110F;border-bottom:2.5px solid #14110F;transform:translateY(-70%) rotate(45deg);pointer-events:none}
#rsel{width:100%;min-height:3.375rem;appearance:none;-webkit-appearance:none;border:2px solid #8C8272;border-radius:12px;background:#fff;color:#14110F;font:600 1.0625rem 'Inter',sans-serif;padding:0 44px 0 16px;cursor:pointer;color-scheme:light}
#rsel:focus{outline:3px solid #FF8200;outline-offset:1px;border-color:#D9620B}

/* === tarjeta de login tipo vidrio === */
body.login .hero .card{background:rgba(255,255,255,.14);-webkit-backdrop-filter:blur(14px) saturate(140%);backdrop-filter:blur(14px) saturate(140%);border:1px solid rgba(255,255,255,.38);box-shadow:0 12px 40px rgba(0,0,0,.28);color:#fff}
body.login .hero .card h2{color:#fff}
body.login .hero .card span,body.login .hero .card .usel{color:#fff!important;text-shadow:0 1px 4px rgba(0,0,0,.4)}
body.login #rsel{background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.6)}
#rsel:focus{outline:none;border-color:#fff}
#rsel:focus-visible{outline:3px solid #FF8200;outline-offset:2px}
body.login #go{background:#FF8200;color:#14110F}
body.login #go:hover{background:#FF9A2E}

/* === encuesta: resumen, barra fija y acordeón === */
.sum2{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:#fff;border:2px solid #E0D3C0;border-radius:18px;overflow:hidden;text-align:left}
.si{display:flex;gap:12px;align-items:center;padding:14px 16px}
.si+.si{border-left:1px solid #EFE2D0}
.si .ic{flex:none;width:2.75rem;height:2.75rem;border-radius:12px;background:#FFE7CC;display:flex;align-items:center;justify-content:center}
.si .ic svg{width:1.5rem;height:1.5rem;fill:none;stroke:#D9620B;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.si small{display:block;font-size:0.75rem;font-weight:700;color:#4A443D;text-transform:uppercase;letter-spacing:.04em}
.si b{display:block;font:700 1.375rem/1.15 'Space Grotesk','Inter',sans-serif;color:#14110F}
.si em{display:block;font-style:normal;font-size:0.8125rem;color:#4A443D}
@media(max-width:640px){.sum2{grid-template-columns:1fr}.si+.si{border-left:0;border-top:1px solid #EFE2D0}.si{padding:10px 14px}.si b{font-size:1.1875rem}}
.stk{position:sticky;top:0;z-index:6;background:#fff;border:2px solid #E0D3C0;border-radius:16px;padding:10px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;box-shadow:0 6px 16px rgba(120,60,0,.10)}
.stk .rowp b{font-size:0.9375rem}
.stk .lnk{min-height:2.25rem;font-size:0.875rem}
.leg2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:0.8125rem;font-weight:700;color:#4A443D}
.leg2 i{font-style:normal;padding:4px 12px;border-radius:99px;font-size:0.8125rem;font-weight:700;border:1.5px solid #14110F}
details.acc{padding:0;overflow:hidden;text-align:left;scroll-margin-top:150px}
details.acc>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:16px 18px;cursor:pointer;min-height:4rem}
details.acc>summary::-webkit-details-marker{display:none}
details.acc>summary:hover{background:#FFF6EC}
details.acc>summary:focus-visible{outline:3px solid #FF8200;outline-offset:-3px}
.qn{flex:none;width:2.25rem;height:2.25rem;border-radius:50%;background:#FFE7CC;color:#B34700;font:700 1rem 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;border:2px solid #D9620B}
details.acc.done .qn{background:#187A41;border-color:#187A41;color:#fff}
.qtx{flex:1;min-width:0}
.qtx small{display:block;font-size:0.75rem;font-weight:700;color:#4A443D}
.qtx .qt{display:block;font:700 1.0625rem/1.35 'Space Grotesk','Inter',sans-serif;color:#14110F}

.qst{flex:none;font-size:0.8125rem;font-weight:700;padding:4px 10px;border-radius:99px;background:#EFE6D8;color:#14110F;white-space:nowrap}
.qst.ok{background:#E3F3E8;color:#187A41}
.chev{flex:none;width:12px;height:12px;border-right:2.5px solid #14110F;border-bottom:2.5px solid #14110F;transform:rotate(45deg);margin:0 4px 4px;transition:transform .2s}
details.acc[open] .chev{transform:rotate(-135deg);margin-top:6px}
details.acc[open]>summary{border-bottom:1px solid #EFE2D0;background:#FFF9F2}
details.acc .rws{padding:4px 18px 16px}
@media(max-width:600px){details.acc>summary{padding:14px 12px;gap:10px}.qtx .qt{font-size:0.9375rem}details.acc .rws{padding:4px 12px 14px}}

@media(max-width:600px){.stk{padding:8px 10px;gap:6px;border-radius:14px}.stk .rowp b{font-size:0.875rem}.stk .lnk{font-size:0.8125rem;min-height:2rem;text-align:right}.leg2{gap:5px;flex-wrap:nowrap}.leg2>span{display:none}.leg2 i{padding:3px 8px;font-size:0.75rem;flex:1;text-align:center}.stk .bar{height:10px}}

/* ===== Barra superior discreta ===== */
html{color-scheme:light}
header{position:sticky;top:0;margin:0;border:0;border-radius:0;box-shadow:none;background:rgba(255,250,244,.88);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-bottom:1px solid #EADCCB;padding:8px max(16px,calc((100% - 68.75rem)/2));min-height:3.75rem;z-index:20;color:#14110F;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .logo{width:2.25rem;height:2.25rem;border-radius:10px;background:#FF8200;color:#14110F;font:700 1.25rem/1 'Space Grotesk',sans-serif;display:flex;align-items:center;justify-content:center}
header .brand b{display:block;font:700 1.1875rem/1 'Space Grotesk',sans-serif;letter-spacing:0;color:inherit}
.brand small{display:block;font-size:0.6562rem;font-weight:700;letter-spacing:.16em;color:#B34700;margin-top:3px}
.hr{display:flex;align-items:center;gap:8px}
#thm{width:2.625rem;height:2.625rem;border-radius:50%;border:1px solid #E0D3C0;background:#fff;color:#14110F;display:flex;align-items:center;justify-content:center;cursor:pointer}
#mb{min-height:2.625rem;padding:0 10px 0 4px;border:1px solid #E0D3C0;background:#fff;color:#14110F;font:600 0.875rem 'Inter',sans-serif;display:flex;align-items:center;gap:8px;border-radius:99px;box-shadow:none}
#thm:hover,#mb:hover{border-color:#D9620B}
#thm:focus-visible,#mb:focus-visible{outline:3px solid #FF8200;outline-offset:2px}
.av3{width:2rem;height:2rem;border-radius:50%;background:#FFE7CC;color:#B34700;font:700 0.75rem 'Inter',sans-serif;display:flex;align-items:center;justify-content:center}
#mb .chv{opacity:.7}
#mp{border:1px solid #E0D3C0;box-shadow:0 12px 32px rgba(60,30,0,.14);border-radius:14px;min-width:240px}
#mp .who{line-height:1.4}
#mp .who b{color:#14110F}
body.login header{background:rgba(10,20,35,.30);border-bottom-color:rgba(255,255,255,.16);color:#fff}
body.login .brand small{color:#FFC48A}
body.login #thm,body.login #mb{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
body.login .av3{background:rgba(255,255,255,.22);color:#fff}
.stk{top:4.4rem}
details.acc{scroll-margin-top:13rem}
@media(max-width:600px){#mbl{display:none}header{padding:8px 12px;min-height:3.5rem}.stk{top:4rem}}
.pt{font-size:1.875rem;margin-top:8px}
.sh{margin-top:22px;font-size:1.375rem}
.of{font-size:1.25rem;color:var(--mute)}
.lbl{display:block;font-size:0.75rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--mute)}
.lock{border-style:dashed!important}
.pend{margin:2px 0 4px;padding:8px 12px;background:#FFF6EC;border-radius:10px;font-size:0.875rem}
.pend li{padding:3px 0}.pend small{color:var(--mute)}
/* ===== Administrador ===== */
.atabs{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding:4px;background:#fff;border:1px solid #E0D3C0;border-radius:14px;scrollbar-width:thin}
.atabs button{flex:none;min-height:2.625rem;padding:0 14px;border:0;border-radius:10px;background:none;color:#4A443D;font:600 0.875rem 'Inter',sans-serif;cursor:pointer;white-space:nowrap}
.atabs button:hover{background:#FFF1E0;color:#14110F}
.atabs button[aria-current=page]{background:#FF8200;color:#14110F}
